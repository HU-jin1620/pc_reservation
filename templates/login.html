<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>登录 - 机时预订</title>
  <link rel="icon" href="{{ url_for('static', filename='jiangyuan-logo.png') }}" type="image/png"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body class="auth-body">
  <div class="auth-card">
    <img class="auth-logo" src="{{ url_for('static', filename='jiangyuan-logo.png') }}" alt="机时预订"/>
    <h1 class="auth-title">深圳PC机时预定系统</h1>
    <form id="loginForm">
      <label>用户名 <input type="text" name="username" autocomplete="username" required/></label>
      <label>密码 <input type="password" name="password" autocomplete="current-password" required/></label>
      <label class="remember-option">
        <input type="checkbox" name="remember" id="rememberMe"/>
        <span>保持登录 30 天</span>
      </label>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
    <p class="auth-switch">没有账号？<a href="{{ url_for('register') }}">注册</a></p>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
