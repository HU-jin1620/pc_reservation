{% extends "base.html" %}
{% block title %}互联设备 - 机时预订{% endblock %}
{% block content %}
<div class="iot-heading">
  <div>
    <h3 class="inline">互联设备</h3>
    <p class="iot-subtitle">通过小米电源控制主机上电与断电</p>
  </div>
  <div class="toolbar iot-actions">
    <span id="iotSummary" class="iot-summary">正在读取状态...</span>
    <button id="refreshBtn" class="btn" type="button">刷新状态</button>
  </div>
</div>
<div id="iotGrid" class="power-grid" aria-live="polite">
  <div class="power-loading">正在读取设备状态...</div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='iot.js') }}"></script>{% endblock %}
