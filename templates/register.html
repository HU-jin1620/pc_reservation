<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>注册 - 机时预订</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body class="auth-body">
  <div class="auth-card">
    <h2>注册账号</h2>
    <form id="registerForm">
      <label>用户名 <input type="text" name="username" autocomplete="username" required/></label>
      <label>密码 <input type="password" name="password" autocomplete="new-password" required minlength="6"/></label>
      <label>确认密码 <input type="password" name="password2" autocomplete="new-password" required minlength="6"/></label>
      <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>
    <p class="auth-switch">已有账号？<a href="{{ url_for('login') }}">登录</a></p>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
