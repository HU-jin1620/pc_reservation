<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}机时预订{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='jiangyuan-logo.png') }}" type="image/png"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <header class="topbar">
    <nav>
      <a href="{{ url_for('booking') }}" class="{{ 'active' if request.endpoint == 'booking' }}">预定列表</a>
      <a href="{{ url_for('devices_page') }}" class="{{ 'active' if request.endpoint == 'devices_page' }}">设备管理</a>
      <a href="{{ url_for('iot_page') }}" class="{{ 'active' if request.endpoint == 'iot_page' }}">互联设备</a>
      <a href="{{ url_for('my_page') }}" class="{{ 'active' if request.endpoint == 'my_page' }}">我的预定</a>
    </nav>
    <div class="user">
      <button id="accountBtn" class="account-btn" type="button" aria-haspopup="dialog" aria-controls="accountModal">
        <span class="account-avatar" aria-hidden="true">{{ username[0]|upper }}</span>
        <span class="uname">{{ username }}</span>
      </button>
      <button id="logoutBtn" class="btn btn-ghost">退出</button>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <div class="modal" id="accountModal" hidden>
    <div class="modal-box account-modal-box" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
      <div class="account-modal-head">
        <div>
          <h3 id="accountModalTitle">个人账户</h3>
          <p class="modal-lead">当前账号：<strong id="accountUsername">{{ username }}</strong></p>
        </div>
        <button class="icon-close" id="closeAccountModal" type="button" aria-label="关闭">×</button>
      </div>
      <form id="changePasswordForm" class="account-form">
        <label>当前密码
          <input type="password" name="current_password" autocomplete="current-password" required/>
        </label>
        <label>新密码
          <input type="password" name="new_password" autocomplete="new-password" minlength="6" required/>
        </label>
        <label>确认新密码
          <input type="password" name="confirm_password" autocomplete="new-password" minlength="6" required/>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn" id="cancelAccountBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="changePasswordBtn">修改密码</button>
        </div>
      </form>
    </div>
  </div>
  <script>window.CURRENT_USER = {{ username|tojson }};</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
